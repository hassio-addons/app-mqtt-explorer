proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_max_temp_file_size    0;

# The browser and the server talk over one Socket.IO connection for as long as
# the page is open, and a subscribed topic can go quiet for a long time before
# the next message. Neither should be cut off for it.
proxy_read_timeout          86400s;
proxy_send_timeout          86400s;

# Socket.IO starts as a WebSocket where it can, and falls back to long polling
# where it cannot. This is what lets the upgrade through.
proxy_set_header Connection $connection_upgrade;
proxy_set_header Upgrade $http_upgrade;

proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;

# The server asks browsers to only ever use HTTPS for this host, its
# subdomains included, for the coming year. Behind Ingress that host is the
# one Home Assistant is served on, which is not this app's to make promises
# about, so the header is dropped on the way out.
proxy_hide_header Strict-Transport-Security;
